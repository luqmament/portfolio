name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for .gitignore
        run: |
          if [ ! -f .gitignore ]; then
            echo "::warning::.gitignore not found — consider creating one"
          fi

      - name: Scan for sensitive files
        run: |
          SENSITIVE_FILES=$(find . -type f \( \
            -name ".env" -o \
            -name ".env.*" -o \
            -name "*.pem" -o \
            -name "*.key" -o \
            -name "*.crt" -o \
            -name "*.p12" -o \
            -name "*.pfx" -o \
            -name "credentials*" -o \
            -name "secrets*" -o \
            -name "tokens*" -o \
            -name "*password*" -o \
            -name "*secret*" -o \
            -name "*.id_rsa*" -o \
            -name "api_key*" -o \
            -name "known_hosts" \
          \) 2>/dev/null | grep -v ".git/" | grep -v "node_modules/" || true)

          if [ -n "$SENSITIVE_FILES" ]; then
            echo "::error::Sensitive files found in repository:"
            echo "$SENSITIVE_FILES"
            echo ""
            echo "These files should NOT be committed to a public repository."
            exit 1
          fi

          echo "✅ No sensitive files found."

      - name: Scan for hardcoded secrets in code
        run: |
          SECRETS=$(grep -rEl "ghp_[a-zA-Z0-9]{36}" . \
            --include="*.js" --include="*.ts" --include="*.py" \
            --include="*.go" --include="*.java" --include="*.json" \
            --include="*.yaml" --include="*.yml" --include="*.sh" \
            --include="*.html" --include="*.css" \
            2>/dev/null | grep -v ".git/" | grep -v "node_modules/" || true)

          if [ -n "$SECRETS" ]; then
            echo "::error::Possible GitHub tokens found:"
            echo "$SECRETS"
            exit 1
          fi

          # Check for AWS keys
          AWS_KEYS=$(grep -rEl "(AKIA|ABIA|ASIA)[0-9A-Z]{16}" . \
            --include="*.js" --include="*.ts" --include="*.py" \
            --include="*.go" --include="*.java" --include="*.json" \
            --include="*.yaml" --include="*.yml" \
            2>/dev/null | grep -v ".git/" | grep -v "node_modules/" || true)

          if [ -n "$AWS_KEYS" ]; then
            echo "::error::Possible AWS access keys found:"
            echo "$AWS_KEYS"
            exit 1
          fi

          # Check for generic secrets
          GENERIC=$(grep -rEl "api[_-]?key[\s]*[=:][\s]*['\"][a-zA-Z0-9]{16,}" . \
            --include="*.js" --include="*.ts" --include="*.py" \
            --include="*.go" --include="*.java" --include="*.json" \
            --include="*.yaml" --include="*.yml" \
            2>/dev/null | grep -v ".git/" | grep -v "node_modules/" || true)

          if [ -n "$GENERIC" ]; then
            echo "::error::Possible API keys found:"
            echo "$GENERIC"
            exit 1
          fi

          echo "✅ No hardcoded secrets detected."

  repo-health:
    name: Repository Health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for .gitignore
        run: |
          if [ ! -f .gitignore ]; then
            echo "::warning::.gitignore not found"
          else
            echo "✅ .gitignore exists"
            echo "   Tracked sensitive patterns:"
            grep -E "(\.env|\.pem|\.key|secret|token|credential|password)" .gitignore | head -10
          fi

      - name: Check for untracked secrets
        run: |
          echo "Files that would be caught by .gitignore:"
          git ls-files --others --ignored --exclude-standard 2>/dev/null | grep -v ".gitignore" | grep -iE "(env|secret|token|key|password|credential)" | head -10 || echo "   None found"

      - name: Verify index.html exists
        run: |
          if [ -f index.html ]; then
            echo "✅ index.html found"
          else
            echo "::warning::index.html not found in repo root"
          fi

      - name: Verify style.css exists
        run: |
          if [ -f style.css ]; then
            echo "✅ style.css found"
          else
            echo "::warning::style.css not found in repo root"
          fi
